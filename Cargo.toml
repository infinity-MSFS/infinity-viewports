[workspace]
resolver = "3"
members = [
    "crates/infinity-viewports-protocol",
    "crates/infinity-viewports-gpu",
    "crates/infinity-viewports-host",
    "crates/infinity-viewports-bridge",
    "crates/infinity-viewports-shim",
    "crates/infinity-viewports-testhost",
    "crates/infinity-viewports-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
authors = ["cameron_griego@protonmail.com"]

[workspace.dependencies]
infinity-viewports-protocol = { path = "crates/infinity-viewports-protocol" }
infinity-viewports-gpu = { path = "crates/infinity-viewports-gpu" }
infinity-viewports-host = { path = "crates/infinity-viewports-host" }
infinity-viewports-shim = { path = "crates/infinity-viewports-shim" }

serde = { version = "1.0", features = ["derive"] }
windows = "0.62"
cc = "1.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
