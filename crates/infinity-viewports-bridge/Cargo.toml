[package]
name = "infinity-viewports-bridge"
description = "in process bridge that handles gpu hook setting and streaming out of sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
infinity-viewports-protocol.workspace = true
infinity-viewports-gpu.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
]
